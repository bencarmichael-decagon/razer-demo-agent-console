[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  port = 8888
  publish = "public"

# Friendly URLs: /api/<name> -> /.netlify/functions/<name>
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/agent"
  status = 302

[[redirects]]
  from = "/agent"
  to = "/agent.html"
  status = 200
